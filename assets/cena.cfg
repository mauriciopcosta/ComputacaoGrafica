# ============================================================================
# Arquivo de configuracao da cena - Grau B
# Lido pelo GrauB_CenaFinal (funcao loadScene). Uma palavra-chave por linha.
# Linhas vazias e iniciadas por '#' sao ignoradas.
#
#   camera  px py pz   yaw pitch   fov near far
#   light   px py pz   r g b       intensidade  on(0/1)
#   object  arquivo.obj  px py pz   rx ry rz(graus)   escala(uniforme)
#   bezier  px py pz     -> ponto de controle do ULTIMO objeto declarado
#                           (use 4, 7, 10... pontos para curvas Bezier cubicas)
# ============================================================================

# --- Camera: comeca afastada e um pouco acima, olhando pra -Z, frustum 0.1..100
camera  0.0 2.0 11.0   -90.0 -8.0   45.0 0.1 100.0

# --- Iluminacao de 3 pontos (key / fill / back) ---
light   5.0 5.0 6.0    1.0 0.97 0.92   1.0   1
light  -5.0 3.0 4.0    0.85 0.9 1.0    0.45  1
light   0.0 6.0 -6.0   1.0 1.0 1.0     0.8   1

# --- Objetos da cena (diorama simples com os modelos da pasta) ---
object  Suzanne.obj         -3.0 0.0 0.0    0.0  25.0 0.0   0.7
object  SuzanneSubdiv1.obj   3.0 0.0 0.0    0.0 -25.0 0.0   0.7

# Cubo no centro, com uma trajetoria Bezier (7 pontos = 2 segmentos cubicos,
# fechando o ciclo: o primeiro e o ultimo ponto sao iguais).
object  Cube.obj             0.0 0.0 -2.0   0.0   0.0 0.0   0.6
bezier   0.0 0.0 -2.0
bezier   3.0 2.0  0.0
bezier   3.0 0.5  3.0
bezier   0.0 1.5  4.0
bezier  -3.0 0.5  3.0
bezier  -3.0 2.0  0.0
bezier   0.0 0.0 -2.0
